# Compiles a real APK. This is the only check that exercises the native layer —
# Gradle, autolinking, and the native modules behind expo-secure-store,
# expo-auth-session and expo-crypto — which Metro bundling cannot verify.
#
# Release rather than debug: a debug build with expo-dev-client boots the dev
# launcher and needs a Metro server, whereas release embeds the JS bundle and
# runs standalone, so the artifact can be sideloaded and used directly. The
# Expo template signs release with the debug keystore, so no secrets are
# needed — fine for internal testing, not for Play Store distribution.
#
# Two triggers, one job:
# - push to main: runs once per merge, not once per PR push, since a ~25min
#   native build on every commit in review is expensive and PRs get plenty
#   of iteration before merge. ci.yml's `bundle` job still runs on every PR
#   push and is the strongest pre-merge signal available (Metro/Hermes
#   compile) short of the real native build — it just can't exercise Gradle,
#   autolinking, or native modules the way this workflow does.
# - release (published): `gh release create`/publishing a draft fires this,
#   and the build attaches its APK straight onto that release — the whole
#   reason the APK is a Checkpoint Trigger's release asset instead of a
#   time-limited Actions artifact you'd have to remember to grab in time.
#
# Actions are referenced by floating major tag rather than pinned SHA, so the
# mutable-action-tag lint is suppressed per line. See ci.yml for the rationale.
name: Android build

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # only release runs need this, to upload the release asset

# A newer commit supersedes an in-flight build. Scoped so a release build
# never gets cancelled by an unrelated PR build sharing the same ref.
concurrency:
  group: android-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # A cold-cache build measured 25m41s, so 30 left too little headroom for a
    # slow runner or a sluggish dependency download.
    timeout-minutes: 45
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v7
        with:
          # On a release event, checkout defaults to the tag ref already —
          # explicit for clarity, since the built APK must match the tagged
          # commit exactly, not whatever main has moved to since.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # React Native 0.76+ requires JDK 17.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: gradle/actions/setup-gradle@v4

      # android/ is not committed (continuous native generation), so it is
      # generated from app.config.ts on every run.
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Only on a release event: attach the same APK to the release page
      # itself, so it's discoverable without digging through Actions runs and
      # doesn't expire like a workflow artifact does.
      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            --clobber
