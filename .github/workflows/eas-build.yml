# Actions are referenced by floating major tag rather than pinned SHA, so the
# mutable-action-tag lint is suppressed per line. See ci.yml for the rationale.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Inputs reach the shell via env vars rather than ${{ }} interpolation,
      # so nothing from the github context is ever expanded into the script.
      - env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: >
          eas build
          --non-interactive
          --no-wait
          --platform "$PLATFORM"
          --profile "$PROFILE"
