name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run codegen:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      # Bundling is a distinct failure class from lint/typecheck: it catches
      # unresolvable imports and anything the Hermes compiler rejects.
      - run: npm run bundle
