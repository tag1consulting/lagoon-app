# Status-only payloads: logs are refetched via queries when these fire,
# matching lagoon-ui's pattern.
subscription DeploymentChanged($environment: Int!) {
  deploymentChanged(environment: $environment) {
    id
    name
    status
    started
    completed
  }
}

subscription TaskChanged($environment: Int!) {
  taskChanged(environment: $environment) {
    id
    name
    status
    started
    completed
  }
}

# --- Version-gated variant --------------------------------------------------

subscription DeploymentChangedDetailed($environment: Int!) {
  deploymentChanged(environment: $environment) {
    id
    name
    status
    started
    completed
    buildStep
  }
}
