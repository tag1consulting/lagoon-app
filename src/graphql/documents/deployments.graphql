query EnvironmentDeployments($name: String!, $project: Int!, $limit: Int) {
  environmentByName(name: $name, project: $project) {
    id
    deployments(limit: $limit) {
      id
      name
      status
      created
      started
      completed
      priority
    }
  }
}

# Dedicated log query: buildLog can be multiple MB, so it must never ride
# along with list-level queries.
query DeploymentWithLog($name: String!, $project: Int!, $deploymentName: String!) {
  environmentByName(name: $name, project: $project) {
    id
    deployments(name: $deploymentName) {
      id
      name
      status
      created
      started
      completed
      buildLog
    }
  }
}

# --- Version-gated variants -------------------------------------------------
# Same shape plus fields absent from Lagoon 2.8. Selected via
# hasFeature(context, 'deploymentDetails'); see src/api/versionGate.ts.

query EnvironmentDeploymentsDetailed($name: String!, $project: Int!, $limit: Int) {
  environmentByName(name: $name, project: $project) {
    id
    deployments(limit: $limit) {
      id
      name
      status
      created
      started
      completed
      priority
      buildStep
      sourceUser
    }
  }
}

